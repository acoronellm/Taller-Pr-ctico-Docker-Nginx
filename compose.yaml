services:
  api:
    build: .
    environment:
      PORT: 3000
    expose:
      - "3000"
    networks:
      - taller-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - taller-network

networks:
  taller-network:
    driver: bridge